<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shayan</title>
<meta name="description" content="Shayan, 17, from Qir.">
<meta name="theme-color" content="#F3F1FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F1FF;
    --ink:#16123A;
    --card:#FFFFFF;
    --nav:rgba(255,255,255,.78);
    --dark:#16123A;          /* fixed dark text for colored blocks */
    --do-bg:#16123A;
    --blue:#4A3DFF;
    --sun:#FFC83D;
    --mint:#7CE3C4;
    --coral:#FF7A66;
    --muted:#5B5780;
    --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
    --body:'Manrope','Segoe UI',system-ui,sans-serif;
  }
  html[data-theme="dark"]{
    --paper:#100E26;
    --ink:#EDEBFF;
    --card:#1E1A47;
    --nav:rgba(30,26,71,.8);
    --do-bg:#0A081C;
    --muted:#A9A4D6;
  }
  html[lang="fa"]{
    --display:'Vazirmatn','Tahoma',system-ui,sans-serif;
    --body:'Vazirmatn','Tahoma',system-ui,sans-serif;
  }
  html[lang="fa"] *{letter-spacing:0!important}   /* keeps Persian letters connected */

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:1.0625rem;line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
  }
  a{color:inherit}
  :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
  .wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}

  /* ---------- nav ---------- */
  .nav{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    z-index:20;display:flex;align-items:center;gap:.25rem;
    padding:.4rem .5rem .4rem 1.1rem;padding-inline:1.1rem .5rem;
    background:var(--nav);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1.5px solid var(--ink);border-radius:999px;
    max-width:calc(100% - 1.5rem);white-space:nowrap;
  }
  .nav .logo{font-family:var(--display);font-weight:800;margin-inline-end:.6rem;text-decoration:none}
  .nav a.link{
    text-decoration:none;font-size:.92rem;font-weight:600;
    padding:.4rem .8rem;border-radius:999px;transition:background .2s,color .2s;
  }
  .nav a.link:hover{background:var(--ink);color:var(--paper)}
  .tool{
    font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;
    min-width:2.3rem;height:2.3rem;padding:0 .7rem;border-radius:999px;
    background:var(--ink);color:var(--paper);border:0;
    transition:transform .15s;
  }
  .tool:active{transform:scale(.92)}
  @media (max-width:700px){
    .nav a.link:not(.keep){display:none}
  }

  /* ---------- hero ---------- */
  .hero{
    min-height:100svh;display:flex;align-items:center;
    padding:7rem 0 4rem;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset-inline-end:-12vw;top:12%;
    width:min(46vw,520px);aspect-ratio:1;border-radius:50%;
    background:var(--sun);border:1.5px solid var(--ink);z-index:0;
  }
  .hero::after{
    content:"";position:absolute;inset-inline-end:6vw;bottom:8%;
    width:min(18vw,190px);aspect-ratio:1;
    border-radius:36% 64% 58% 42% / 44% 40% 60% 56%;
    background:var(--mint);border:1.5px solid var(--ink);z-index:0;
  }
  .hero .wrap{position:relative;z-index:1}
  .chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.6rem}
  .chip{
    font-weight:600;font-size:.92rem;padding:.35rem .9rem;
    border:1.5px solid var(--ink);border-radius:999px;background:var(--card);
  }
  .chip.fill{background:var(--blue);color:#fff;border-color:var(--blue)}
  h1{
    font-family:var(--display);font-weight:800;
    font-size:clamp(3rem,10.5vw,8.5rem);
    line-height:.95;letter-spacing:-.035em;min-height:2em;
  }
  html[lang="fa"] h1{line-height:1.25;font-size:clamp(2.8rem,9.5vw,7.5rem)}
  .caret{
    display:inline-block;width:.07em;height:.82em;margin-inline-start:.04em;
    background:var(--blue);vertical-align:-.05em;
    animation:blink 1s steps(2,start) infinite;
  }
  @keyframes blink{to{visibility:hidden}}
  .hero .sub{
    margin-top:1.8rem;max-width:34ch;
    font-size:clamp(1.15rem,2.4vw,1.5rem);line-height:1.5;color:var(--muted);font-weight:500;
  }
  .hero .sub b{color:var(--ink);font-weight:700}
  .typo-note{margin-top:2.2rem;font-size:.9rem;color:var(--muted);max-width:40ch}

  /* ---------- sections ---------- */
  section{padding:6rem 0}
  h2{
    font-family:var(--display);font-weight:800;
    font-size:clamp(2.2rem,5.5vw,3.8rem);
    letter-spacing:-.03em;line-height:1.1;margin-bottom:2.5rem;
  }

  /* about */
  .about-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:3rem;align-items:start}
  .about-grid h2{margin-bottom:0}
  .about-list{list-style:none;display:grid;gap:.9rem}
  .about-list li{
    font-family:var(--display);font-weight:700;
    font-size:clamp(1.25rem,2.6vw,1.8rem);line-height:1.35;letter-spacing:-.02em;
    padding:1.1rem 1.4rem;background:var(--card);border:1.5px solid var(--ink);
  }
  /* radii: start-start / start-end / end-end / end-start (mirrors automatically in RTL) */
  .about-list li:nth-child(1){border-start-start-radius:28px;border-start-end-radius:28px;border-end-end-radius:28px;border-end-start-radius:6px}
  .about-list li:nth-child(2){border-start-start-radius:6px;border-start-end-radius:28px;border-end-end-radius:28px;border-end-start-radius:28px;background:var(--mint);color:var(--dark);border-color:var(--dark)}
  .about-list li:nth-child(3){border-start-start-radius:28px;border-start-end-radius:6px;border-end-end-radius:28px;border-end-start-radius:28px;margin-inline-start:1.5rem}
  .about-list li:nth-child(4){border-start-start-radius:28px;border-start-end-radius:28px;border-end-end-radius:6px;border-end-start-radius:28px;background:var(--sun);color:var(--dark);border-color:var(--dark)}
  .about-extra{max-width:56ch;color:var(--muted);font-weight:500;margin-top:1.4rem}
  @media (max-width:820px){
    .about-grid{grid-template-columns:1fr;gap:1rem}
    .about-grid h2{margin-bottom:1rem}
    .about-list li:nth-child(3){margin-inline-start:0}
  }

  /* what I do */
  .do{background:var(--do-bg);color:#F3F1FF}
  .do h2{color:#F3F1FF}
  .do-row{
    display:grid;grid-template-columns:minmax(150px,.7fr) 2fr auto;gap:1.5rem;align-items:center;
    padding:2rem 0;border-top:1.5px solid rgba(243,241,255,.28);
  }
  .do-row:last-of-type{border-bottom:1.5px solid rgba(243,241,255,.28)}
  .do-row h3{
    font-family:var(--display);font-weight:800;
    font-size:clamp(1.8rem,4vw,2.9rem);letter-spacing:-.03em;line-height:1.1;
  }
  .do-row p{font-size:clamp(1.05rem,2vw,1.3rem);color:#CFCAF5;max-width:36ch}
  .do-action{min-width:120px;display:flex;justify-content:flex-end}
  .sec-btn{
    font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;
    padding:.6rem 1.1rem;border-radius:999px;
    background:transparent;color:#F3F1FF;border:1.5px solid #F3F1FF;
    transition:background .2s,color .2s,transform .15s;
  }
  .sec-btn:hover{background:#F3F1FF;color:#16123A}
  .sec-btn:active{transform:scale(.96)}
  .sec-btn.done{background:var(--mint);color:#16123A;border-color:var(--mint)}
  .court{
    position:relative;width:170px;height:84px;border-radius:999px;direction:ltr;
    border:1.5px dashed rgba(243,241,255,.5);touch-action:none;
  }
  .court .net{position:absolute;left:50%;top:6px;bottom:6px;width:1.5px;background:rgba(243,241,255,.35)}
  .ball{
    position:absolute;left:12px;top:23px;width:38px;height:38px;
    border-radius:50%;background-color:var(--sun);border:1.5px solid #F3F1FF;
    transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1);
    background-image:linear-gradient(#16123A,#16123A),linear-gradient(#16123A,#16123A);
    background-size:100% 1.5px,1.5px 100%;background-position:center;background-repeat:no-repeat;
  }
  @media (max-width:760px){
    .do-row{grid-template-columns:1fr;gap:.8rem}
    .do-action{justify-content:flex-start}
  }

  /* skills */
  .skills{display:grid;grid-template-columns:repeat(6,1fr);gap:1.1rem}
  .skill{
    border:1.5px solid var(--ink);padding:1.6rem;background:var(--card);
    display:flex;flex-direction:column;justify-content:space-between;gap:2.2rem;min-height:230px;
  }
  .skill:nth-child(1){grid-column:span 4;background:var(--blue);color:#fff;border-color:var(--dark);
    border-start-start-radius:36px;border-start-end-radius:36px;border-end-end-radius:36px;border-end-start-radius:8px}
  .skill:nth-child(2){grid-column:span 2;
    border-start-start-radius:36px;border-start-end-radius:8px;border-end-end-radius:36px;border-end-start-radius:36px}
  .skill:nth-child(3){grid-column:span 2;background:var(--coral);color:var(--dark);border-color:var(--dark);
    border-start-start-radius:8px;border-start-end-radius:36px;border-end-end-radius:36px;border-end-start-radius:36px}
  .skill:nth-child(4){grid-column:span 4;background:var(--mint);color:var(--dark);border-color:var(--dark);
    border-start-start-radius:36px;border-start-end-radius:36px;border-end-end-radius:8px;border-end-start-radius:36px}
  .skill p{
    font-family:var(--display);font-weight:700;
    font-size:clamp(1.3rem,2.6vw,2rem);line-height:1.35;letter-spacing:-.02em;
  }
  .status{
    align-self:flex-start;font-weight:700;font-size:.85rem;
    padding:.3rem .8rem;border-radius:999px;border:1.5px solid currentColor;
  }
  .meter{
    position:relative;height:12px;border-radius:99px;border:1.5px solid var(--ink);
    background:rgba(128,128,160,.25);overflow:hidden;
  }
  .meter i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);background:var(--ink)}
  .skill small{font-size:.85rem;font-weight:700;display:block;margin-top:.5rem;opacity:.85}
  @media (max-width:820px){
    .skill:nth-child(n){grid-column:span 6;min-height:0}
  }

  /* projects */
  .timeline{position:relative;display:grid;gap:1.4rem;padding-inline-start:2.6rem}
  .timeline::before{
    content:"";position:absolute;inset-inline-start:11px;top:14px;bottom:14px;
    border-inline-start:2px dashed var(--ink);
  }
  .proj{position:relative;padding:1.6rem 1.8rem;border:1.5px solid var(--ink);border-radius:22px;background:var(--card)}
  .proj::before{
    content:"";position:absolute;inset-inline-start:-2.6rem;top:1.9rem;
    width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);
  }
  .proj.now{background:var(--sun);color:var(--dark);border-color:var(--dark)}
  .proj.now::before{background:var(--blue);box-shadow:0 0 0 6px rgba(74,61,255,.28)}
  .proj.next{border-style:dashed;background:transparent}
  .proj h3{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;line-height:1.3}
  .proj .when{font-weight:700;font-size:.9rem;color:var(--muted);margin-bottom:.3rem;display:block}
  .proj.now .when{color:var(--dark)}
  .proj p{max-width:48ch}

  /* contact */
  .contact{padding-bottom:4rem}
  .contact-card{
    background:var(--blue);color:#fff;border:1.5px solid var(--dark);
    border-radius:44px;padding:clamp(2rem,6vw,4.5rem);display:grid;gap:2rem;
  }
  .contact-card h2{margin:0;color:#fff}
  .contact-lines{display:grid;gap:.4rem}
  .contact-lines p{
    font-family:var(--display);font-weight:700;
    font-size:clamp(1.4rem,3.4vw,2.4rem);line-height:1.3;letter-spacing:-.02em;
  }
  .contact-lines p:nth-child(2){opacity:.85}
  .contact-lines p:nth-child(3){opacity:.7}
  .cta-row{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center}
  .btn{
    font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer;text-decoration:none;
    display:inline-block;padding:.9rem 1.6rem;border-radius:999px;
    background:var(--sun);color:#16123A;border:1.5px solid #16123A;
    transition:transform .15s,background .2s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0) scale(.97)}
  .btn.ghost{background:transparent;color:#fff;border-color:#fff}
  .btn.ghost:hover{background:#fff;color:#16123A}
  #reply{min-height:1.6em;font-weight:700}
  footer{padding:1rem 0 3rem;color:var(--muted);font-size:.92rem}

  .hero .chips,.hero .sub,.hero .typo-note{animation:rise .8s .15s both cubic-bezier(.2,.8,.2,1)}
  .hero .sub{animation-delay:.35s}
  .hero .typo-note{animation-delay:.55s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

  <section id="about">

        <li data-i18n="about_1"></li>

        <li data-i18n="about_3"></li>

  <section id="do" class="do">
    <div class="wrap">

      <div class="do-row">
        <h3 data-i18n="do_code_h"></h3>
        <p data-i18n="do_code_p"></p>
        <div class="do-action"></div>
      </div>

      <div class="do-row">
        <h3 data-i18n="do_sec_h"></h3>
        <p data-i18n="do_sec_p"></p>
        <div class="do-action"><button class="sec-btn" id="dontClick" type="button"></button></div>
      </div>

      <div class="do-row">
        <h3 data-i18n="do_vol_h"></h3>
        <p data-i18n="do_vol_p"></p>
        <div class="do-action">
          <div class="court" id="court" aria-hidden="true">
            <span class="net"></span>
            <span class="ball" id="ball"></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="skills">
    <div class="wrap">
      <h2 data-i18n="skills_h">Skills</h2>
      <div class="skills">
        <article class="skill"><p data-i18n="sk_1"></p><span class="status" data-i18n="sk_1s"></span></article>
        <article class="skill">
          <p data-i18n="sk_2"></p>
          <div>
            <div class="meter" role="img" data-i18n-aria="sk_2a"><i style="--w:97%"></i></div>
            <small data-i18n="sk_2s"></small>
          </div>
        </article>
        <article class="skill"><p data-i18n="sk_3"></p><span class="status" data-i18n="sk_3s"></span></article>
        <article class="skill"><p data-i18n="sk_4"></p><span class="status" data-i18n="sk_4s"></span></article>
      </div>
    </div>
  </section>

  <section id="projects">
    <div class="wrap">
      <h2 data-i18n="proj_h">Projects</h2>
      <div class="timeline">
        <article class="proj">
          <span class="when" data-i18n="pj_1w"></span>
          <h3 data-i18n="pj_1h"></h3>
          <p data-i18n="pj_1p"></p>
        </article>
        <article class="proj now">
          <span class="when" data-i18n="pj_2w"></span>
          <h3 data-i18n="pj_2h"></h3>
          <p data-i18n="pj_2p"></p>
        </article>
        <article class="proj next">
          <span class="when" data-i18n="pj_3w"></span>
          <h3 data-i18n="pj_3h"></h3>
          <p data-i18n="pj_3p"></p>
        </article>
      </div>
    </div>
  </section>

  <section id="contact" class="contact">
    <div class="wrap">
      <div class="contact-card">
        <h2 data-i18n="contact_h">Contact</h2>
        <div class="contact-lines">
          <p data-i18n="ct_1"></p>
          <p data-i18n="ct_2"></p>
          <p data-i18n="ct_3"></p>
        </div>
        <div class="cta-row">
          <!-- TODO: put your real email here -->
          <a class="btn" href="mailto:your-email@example.com" data-i18n="ct_btn1"></a>
          <!-- TODO: put your real GitHub username here -->
          <a class="btn ghost" href="https://github.com/your-username" target="_blank" rel="noopener" data-i18n="ct_btn2"></a>
          <button class="btn ghost" id="replyBtn" type="button" data-i18n="ct_btn3"></button>
        </div>
        <p id="reply" aria-live="polite"></p>
      </div>
    </div>
  </section>

</main>

<footer><div class="wrap" data-i18n="footer"></div></footer>

      nav_about:"درباره‌ام", nav_do:"چیکار می‌کنم", nav_skills:"مهارت‌ها", nav_projects:"پروژه‌ها", nav_contact:"تماس",
      chip_age:"۱۷ ساله", chip_city:"اهل قیر",
      hero_final:"سلام، من شایانم.",
      hero_sub:"کد می‌نویسم، روی هیچی کلیک نمی‌کنم و تو <b>۷۰۰۰ تا زبان دنیا ساکتم.</b>",
      hero_note:"آره، تو تیتر غلط تایپ کردم. اسمش «نمایش زنده‌ی مهارت» هست.",
      about_h:"درباره‌ام",
      about_1:"من شایانم.",
      about_2:"۱۷ سالمه و اهل قیرم.",

      do_h:"چیکار می‌کنم",
      do_code_h:"کد", do_code_p:"کد می‌نویسم. گاهی حتی عمداً کار می‌کنه.",
      do_sec_h:"امنیت سایبری", do_sec_p:"امنیت سایبری کار می‌کنم. بیشترش به این شکله که روی هیچی کلیک نمی‌کنم.",
      do_vol_h:"والیبال", do_vol_p:"والیبال بازی می‌کنم. با توپ یه تفاهمی داریم: اون یه طرف می‌ره، من یه طرف دیگه.",
      sec:["کلیکم کن","اشتباه شد","دیگه تکرار نمی‌شه"],
      skills_h:"مهارت‌ها",
      sk_1:"در یخچال رو باز می‌کنم، یه نگاه می‌ندازم، می‌بندمش. ده دقیقه بعد دوباره همین کار.", sk_1s:"حرفه‌ای",
      sk_2:"یه بار نزدیک بود تکلیفمو تموم کنم. یه «نزدیک بود»ِ خیلی قوی.", sk_2s:"نزدیک بود", sk_2a:"پیشرفت تکلیف: ۹۷ درصد",
      sk_3:"سرعت تایپم عالیه، به شرطی که بک‌اسپیس‌ها رو حساب نکنی.", sk_3s:"بک‌اسپیس: ۴۱٪",
      sk_4:"آواز هم می‌خونم. فعلاً نه میکروفون تأییدش کرده، نه همسایه‌ها، نه حتی گوش خودم.", sk_4s:"تأییدنشده",
      proj_h:"پروژه‌ها",

      ct_btn1:"پیام بده", ct_btn2:"گیت‌هاب", ct_btn3:"جواب می‌دم؟",
      answers:["شاید.","احتمالاً. یه روزی.","هر دو جمله قبلاً هم درست بوده.","بستگی داره «جواب» رو چی تعریف کنی."],
      footer:"ساخته‌ی شایان. بیشترش عمدی.",

      type:[{t:"سلام، من شیا"},{b:2},{t:"ایانم."}]

  };

  var root = document.documentElement;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lang = 'en';
  var store = {get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
               set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

  /* ---------- typing animation (typos + backspaces) ---------- */
  var out = document.getElementById('typedText');
  var typed = document.getElementById('typed');
  var token = 0;
  function startTyping(){
    var my = ++token, text = "", i = 0, steps = T[lang].type;
    typed.setAttribute('aria-label', T[lang].hero_final);
    out.textContent = "";
    if(reduce){ out.textContent = T[lang].hero_final; return; }
    function run(){
      if(my !== token || i >= steps.length) return;
      var s = steps[i];
      if(s.t){
        var chars = Array.from(s.t), k = 0;
        (function nextChar(){
          if(my !== token) return;
          if(k < chars.length){ text += chars[k++]; out.textContent = text; setTimeout(nextChar, 95 + Math.random()*60); }
          else { i++; setTimeout(run, 250); }
        })();
      } else {
        var n = s.b;
        setTimeout(function back(){
          if(my !== token) return;
          if(n > 0){ var a = Array.from(text); a.pop(); text = a.join(""); out.textContent = text; n--; setTimeout(back, 150); }
          else { i++; setTimeout(run, 220); }
        }, 550);
      }
    }
    setTimeout(run, 400);
  }

  /* ---------- language ---------- */
  var secState = 0, secBtn = document.getElementById('dontClick');
  var replyI = 0, reply = document.getElementById('reply');
  function renderSec(){ secBtn.textContent = T[lang].sec[secState]; secBtn.classList.toggle('done', secState === 1); }

  function setLang(l, restart){
    lang = l;
    root.lang = l; root.dir = (l === 'fa') ? 'rtl' : 'ltr';
    document.title = T[l].title;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var v = T[l][el.getAttribute('data-i18n')];
      if(v !== undefined) el.innerHTML = v;
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){
      el.setAttribute('aria-label', T[l][el.getAttribute('data-i18n-aria')]);
    });
    document.getElementById('langBtn').textContent = T[l].langBtn;
    document.getElementById('langBtn').setAttribute('aria-label', l === 'fa' ? 'Switch to English' : 'تغییر به فارسی');
    reply.textContent = "";
    renderSec();
    store.set('lang', l);
    if(restart !== false) startTyping();
  }
  document.getElementById('langBtn').addEventListener('click', function(){
    setLang(lang === 'en' ? 'fa' : 'en');
  });

  /* ---------- theme ---------- */
  var themeBtn = document.getElementById('themeBtn');
  function setTheme(t){
    if(t === 'dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
    themeBtn.textContent = (t === 'dark') ? '☀' : '☾';
    store.set('theme', t);
  }
  themeBtn.addEventListener('click', function(){
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  var savedTheme = store.get('theme');
  setTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  /* ---------- cybersecurity button ---------- */
  secBtn.addEventListener('click', function(){
    if(secState !== 0) return;
    secState = 1; renderSec();
    setTimeout(function(){ secState = 2; renderSec(); }, 1800);
  });

  /* ---------- volleyball ball dodges the pointer ---------- */
  var court = document.getElementById('court'), ball = document.getElementById('ball');
  if(!reduce){
    var bs = 38;
    function dodge(e){
      var r = court.getBoundingClientRect();
      var px = e.clientX - r.left, py = e.clientY - r.top;
      var bx = ball.offsetLeft + bs/2, by = ball.offsetTop + bs/2;
      var dx = bx - px, dy = by - py;
      if(Math.sqrt(dx*dx + dy*dy) < 54){
        ball.style.left = (Math.random()*(court.clientWidth - bs - 8) + 4) + "px";
        ball.style.top  = (Math.random()*(court.clientHeight - bs - 8) + 4) + "px";
      }
    }
    court.addEventListener('pointermove', dodge);
    court.addEventListener('pointerdown', dodge);
  }

  /* ---------- reply button ---------- */
  document.getElementById('replyBtn').addEventListener('click', function(){
    var a = T[lang].answers;
    reply.textContent = a[replyI % a.length]; replyI++;
  });

  /* ---------- init ---------- */
  var saved = store.get('lang');
  var initial = saved || ((navigator.language || '').toLowerCase().indexOf('fa') === 0 ? 'fa' : 'en');
  setLang(initial);
})();
</script>
